<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Me Anything</title>
    <style>
        /* --- CSS STYLES --- */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        h1 {
            color: #ff4b6e;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            position: relative;
            height: 60px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
            min-width: 100px;
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }

        #yesBtn:hover {
            background-color: #45a049;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #ff4b6e;
            color: white;
            position: relative;
        }

        /* Mobile phones - stack buttons vertically */
        @media (max-width: 480px) {
            .btn-group {
                flex-direction: column;
                gap: 20px;
                height: auto;
            }
            
            button {
                width: 100%;
                max-width: 200px;
            }
        }

        /* The success message hidden by default */
        #successMessage {
            display: none;
            color: #4CAF50;
            font-size: 20px;
            animation: popIn 0.5s;
        }

        /* Start Screen Overlay */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff4b6e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
        }
        
        #startScreen h2 {
            color: white;
            font-size: 30px;
            animation: pulse 1.5s infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. START SCREEN -->
    <div id="startScreen" onclick="startGame()">
        <h2>Click Anywhere to Start 💖</h2>
    </div>

    <!-- 2. MAIN CONTENT -->
    <div class="container">
        
        <!-- Question Text -->
        <h1 id="questionText">Will you be my Girlfriend?</h1>

        <!-- Buttons Container -->
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
            <button id="noBtn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">No</button>
        </div>

        <!-- Success Message -->
        <div id="successMessage">
            <h2>I love you madly 😭♥️</h2>
            <p id="customMessage">I tried every possible things to prove you that I am the only one person who can do anything for you🥺♥️</p>
        </div>

    </div>

    <!-- Audio File - CHANGED TO song.mp3 -->
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* --- CONFIGURATION --- */
        
        const questionText = "Will you be my Girlfriend?";
        const successText = "I tried every possible things to prove you that I am the only one person who can do anything for you🥺♥️";
        
        /* --- LOGIC --- */
        
        const startScreen = document.getElementById('startScreen');
        const questionElement = document.getElementById('questionText');
        const btnGroup = document.getElementById('btnGroup');
        const successMsg = document.getElementById('successMessage');
        const customMsg = document.getElementById('customMessage');
        const music = document.getElementById('bgMusic');
        const noBtn = document.getElementById('noBtn');

        // Initialize config
        questionElement.innerText = questionText;
        customMsg.innerText = successText;

        function startGame() {
            startScreen.style.display = "none";
            music.volume = 0.5;
            music.play().catch(error => console.log("Audio play failed:", error));
        }

        function yesClicked() {
            questionElement.style.display = 'none';
            btnGroup.style.display = 'none';
            successMsg.style.display = 'block';
            customMsg.innerText = successText;
        }

        function moveNoBtn() {
            // Get the container dimensions
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            
            // Calculate random position within the container
            const maxX = containerRect.width - 80;
            const maxY = containerRect.height - 50;
            
            const randomX = Math.random() * maxX * 0.5 + 20;
            const randomY = Math.random() * maxY * 0.3 + 20;
            
            // Move the button using transform
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            // Change the text
            const phrases = ["Are you sure?", "Don't do it!", "Wait!", "Think again!"];
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            noBtn.innerText = randomPhrase;
        }
    </script>
</body>
</html>
